name: models-snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

concurrency:
  group: models-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh snapshot
        run: bun packages/config/script/refresh-models.ts
        env:
          RINGKO_MODELS_URL: ${{ vars.RINGKO_MODELS_URL }}

      - name: Commit changes
        run: |
          set -euo pipefail
          FILES=(packages/config/models.dev.json packages/config/models.metadata.json)
          if [ -z "$(git status --short -- "${FILES[@]}")" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "chore(config): refresh model catalog snapshot"
          git push
