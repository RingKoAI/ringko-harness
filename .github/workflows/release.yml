name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  binaries:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: ringko-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: ringko-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: ringko-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: ringko-darwin-x64
          - os: windows-latest
            target: bun-windows-x64
            artifact: ringko-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v6

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        run: pnpm --filter @ringko-ai/webui build

      - name: Compile ${{ matrix.target }}
        run: bun packages/tui/scripts/compile.mjs dist/${{ matrix.artifact }} ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/webui/
          if-no-files-found: error
