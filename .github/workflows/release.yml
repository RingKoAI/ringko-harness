name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: ringko-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: ringko-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: ringko-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: ringko-darwin-x64
          - os: windows-latest
            target: bun-windows-x64
            artifact: ringko-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v6

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        run: pnpm --filter @ringko-ai/webui build

      - name: Compile ${{ matrix.target }}
        run: bun packages/tui/scripts/compile.mjs dist/${{ matrix.artifact }} ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/webui/
          if-no-files-found: error

  npm:
    name: Publish npm package
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v6

      - name: Validate release version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/tui/package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Release tag must match packages/tui/package.json: v${version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${version.includes('-') ? 'next' : 'latest'}\n`);
          NODE

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build npm package
        run: pnpm build:npm

      - name: Verify npm package
        run: pnpm test:npm

      - name: Install OIDC-capable npm
        run: npm install --global npm@12

      - name: Inspect package contents
        working-directory: dist/npm-tui
        run: npm pack --dry-run

      - name: Publish to npmjs with OIDC
        working-directory: dist/npm-tui
        run: npm publish --access public --tag "${{ steps.version.outputs.tag }}"
